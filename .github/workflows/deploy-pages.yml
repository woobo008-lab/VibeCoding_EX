name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Inter_Map/package-lock.json
      - name: Build Inter_Map
        working-directory: Inter_Map
        run: |
          npm ci
          npm run build
      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html portfolio.html _site/
          for d in FC_quiz AI_C_Pallet IC_DASH_BD TODOLIST; do
            mkdir -p "_site/$d"
            cp -R "$d"/. "_site/$d/"
          done
          mkdir -p _site/Inter_Map
          cp -R Inter_Map/dist/. _site/Inter_Map/
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
