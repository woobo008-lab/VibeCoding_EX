<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="제품 카테고리별 데이터를 확인하는 인터랙티브 대시보드"
    />
    <title>InterD Dashboard</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./sales-data.js" defer></script>
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main class="dashboard">
      <header class="page-header">
        <div class="heading">
          <p class="eyebrow">INSIGHTS</p>
          <h1>제품 대시보드</h1>
          <p class="subtitle">제품 카테고리별 주요 지표를 한눈에 확인하세요.</p>
        </div>

        <label class="category-control" for="category-select">
          <span>제품 카테고리</span>
          <select id="category-select" name="category">
            <option value="all">전체 카테고리</option>
            <option value="electronics">전자제품</option>
            <option value="fashion">패션</option>
            <option value="home">홈 &amp; 리빙</option>
            <option value="food">식품</option>
            <option value="beauty">뷰티</option>
          </select>
        </label>
      </header>

      <p class="data-note" id="data-note">
        예시 데이터 · 실제 판매 실적이 아닙니다 · 2025년 월별 판매 수량
      </p>
      <p class="refresh-status" id="refresh-status" role="status" aria-live="polite"></p>

      <section class="chart-grid" aria-label="제품 분석 차트">
        <article class="chart-card">
          <div class="card-heading">
            <div>
              <h2>카테고리별 판매량</h2>
              <p class="year-label">2025년 누적 판매 수량</p>
            </div>
            <div class="card-actions">
              <span class="chart-type" aria-label="막대 차트">막대</span>
              <button class="export-button" type="button" data-export-chart="bar-chart" data-filename="sales-by-category.png">
                PNG 저장
              </button>
            </div>
          </div>
          <div class="chart-area">
            <svg id="bar-chart" class="chart-svg" role="img" aria-label="2025년 카테고리별 판매량 막대 차트"></svg>
          </div>
          <p class="chart-footnote" id="bar-footnote"></p>
        </article>

        <article class="chart-card">
          <div class="card-heading">
            <div>
              <h2 id="line-title">월별 판매량 추이</h2>
              <p class="year-label">2025년 월별 판매 수량</p>
            </div>
            <div class="card-actions">
              <span class="chart-type" aria-label="꺾은선 차트">꺾은선</span>
              <button class="export-button" type="button" data-export-chart="line-chart" data-filename="monthly-sales-trend.png">
                PNG 저장
              </button>
            </div>
          </div>
          <div class="chart-area">
            <svg id="line-chart" class="chart-svg" role="img" aria-label="2025년 월별 판매량 꺾은선 차트"></svg>
          </div>
          <p class="chart-footnote" id="line-footnote"></p>
        </article>

        <article class="chart-card donut-card">
          <div class="card-heading">
            <div>
              <h2 id="donut-title">연간 카테고리 구성</h2>
              <p class="year-label">2025년 누적 판매량 비중</p>
            </div>
            <div class="card-actions">
              <span class="chart-type" aria-label="도넛 차트">도넛</span>
              <button class="export-button" type="button" data-export-chart="donut-chart" data-filename="sales-category-share.png">
                PNG 저장
              </button>
            </div>
          </div>
          <div class="donut-content">
            <div class="donut">
              <svg id="donut-chart" class="donut-svg" role="img" aria-label="2025년 카테고리별 판매량 도넛 차트"></svg>
            </div>
            <ul class="legend" id="donut-legend" aria-label="카테고리 범례"></ul>
          </div>
          <p class="chart-footnote" id="donut-footnote"></p>
        </article>
      </section>
      <p class="export-status" id="export-status" role="status" aria-live="polite"></p>
      <p class="selection-status" id="selection-status" aria-live="polite">
        현재 선택: 전체 카테고리
      </p>
    </main>
    <div class="chart-tooltip" id="chart-tooltip" role="tooltip" hidden>
      <strong id="tooltip-value"></strong>
      <span id="tooltip-note"></span>
    </div>
  </body>
</html>
