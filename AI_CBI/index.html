<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AI와 대화를 나눌 수 있는 채팅 페이지입니다."
    />
    <title>AI CBI | 채팅</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="AI CBI 홈">
          <span class="brand-mark" aria-hidden="true">c</span>
          <span>AI CBI</span>
        </a>
        <div class="topbar-status">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="save-status">대화가 자동 저장됩니다</span>
        </div>
        <button class="new-chat-button" id="new-chat" type="button">
          <span aria-hidden="true">＋</span>
          <span>새 대화</span>
        </button>
      </header>

      <div class="workspace">
        <aside class="history-panel" aria-labelledby="history-title">
          <div class="history-heading">
            <h2 id="history-title">저장된 대화</h2>
            <span class="history-count" id="history-count">0</span>
          </div>
          <p class="history-empty" id="history-empty">저장된 대화가 여기에 표시됩니다.</p>
          <nav class="history-list" id="history-list" aria-label="저장된 대화 목록"></nav>
        </aside>

        <section class="chat-panel" aria-labelledby="chat-title">
          <p class="storage-error" id="storage-error" role="alert" hidden></p>
          <div class="chat-heading">
            <div class="assistant-avatar" aria-hidden="true">✳</div>
            <div>
              <p class="eyebrow">AI CBI 어시스턴트</p>
              <h1 id="chat-title">무엇이든 물어보세요</h1>
            </div>
          </div>

          <div
            class="conversation"
            id="conversation"
            aria-label="대화 내용"
            aria-live="polite"
            aria-relevant="additions text"
          >
            <article class="message assistant-message">
              <div
                class="message-avatar assistant-message-avatar"
                aria-hidden="true"
              >
                ✳
              </div>
              <div class="message-content">
                <p class="message-author">AI CBI</p>
                <div class="message-bubble">
                  안녕하세요! 궁금한 점이나 필요한 일을 편하게 말씀해 주세요.
                </div>
              </div>
            </article>
          </div>

          <div class="composer-area">
            <p class="origin-notice" id="origin-notice" hidden>
              파일을 직접 열고 있습니다. 반복되는 마이크 권한 요청을 줄이려면 VS Code 작업
              <strong>AI_CBI: Run on localhost</strong>를 실행하고
              <a href="http://localhost:4173">localhost:4173</a>에서 이용해 주세요.
            </p>
            <div class="suggestions" aria-label="질문 예시">
              <button class="suggestion" type="button" data-prompt="아이디어를 함께 정리해줘">
                아이디어 정리하기
              </button>
              <button class="suggestion" type="button" data-prompt="오늘 할 일을 계획해줘">
                할 일 계획하기
              </button>
              <button class="suggestion" type="button" data-prompt="새로운 것을 쉽게 설명해줘">
                쉽게 설명 듣기
              </button>
            </div>
            <form class="composer" id="chat-form">
              <label class="visually-hidden" for="message-input">메시지 입력</label>
              <textarea
                id="message-input"
                name="message"
                rows="1"
                placeholder="메시지를 입력하세요..."
                maxlength="4000"
                required
              ></textarea>
              <div class="composer-footer">
                <span class="input-hint">Enter로 전송 · Shift + Enter로 줄바꿈</span>
                <div class="composer-actions">
                  <button
                    class="voice-button"
                    id="voice-input"
                    type="button"
                    aria-label="음성 입력 시작"
                    aria-pressed="false"
                    title="음성 입력"
                  >
                    <svg viewBox="0 0 20 20" aria-hidden="true">
                      <rect x="7" y="2.5" width="6" height="10" rx="3" />
                      <path d="M4.5 9.5a5.5 5.5 0 0 0 11 0M10 15v3M7 18h6" />
                    </svg>
                  </button>
                  <button class="send-button" type="submit" aria-label="메시지 전송">
                    <span>전송</span>
                    <svg viewBox="0 0 20 20" aria-hidden="true">
                      <path d="M3.5 10h12M10 4.5l5.5 5.5-5.5 5.5" />
                    </svg>
                  </button>
                </div>
              </div>
              <p class="voice-status" id="voice-status" role="status" aria-live="polite" hidden></p>
              <button
                class="voice-setup-button"
                id="voice-local-setup"
                type="button"
                hidden
              >
                기기 내 한국어 음성 인식 준비
              </button>
            </form>
            <p class="disclaimer">AI가 생성한 답변은 정확하지 않을 수 있습니다.</p>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
